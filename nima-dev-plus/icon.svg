<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- 圆角方形背景 -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- 背景装饰：细微圆环 -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- ==== 泥马（骆驼）剪影 ==== -->
  <g transform="translate(120, 140)" opacity="0.2">
    <!-- 骆驼身体 -->
    <ellipse cx="136" cy="180" rx="80" ry="40" fill="none" stroke="#fff" stroke-width="3"/>
    <!-- 驼峰 -->
    <path d="M100,140 Q110,110 130,130 Q150,105 170,130 Q185,115 200,140" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <!-- 脖子 -->
    <path d="M190,155 Q210,130 220,100 Q225,85 215,75" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <!-- 头 -->
    <ellipse cx="212" cy="70" rx="15" ry="10" fill="none" stroke="#fff" stroke-width="2.5"/>
    <!-- 腿 -->
    <line x1="80" y1="200" x2="75" y2="240" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="110" y1="205" x2="105" y2="245" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="170" y1="205" x2="175" y2="245" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="200" y1="200" x2="205" y2="240" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ==== 状态机节点连线 ==== -->
  <line x1="80" y1="280" x2="432" y2="280" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="6,8"/>

  <!-- ==== 状态节点 1：筑基 (S) ==== -->
  <circle cx="120" cy="280" r="28" fill="url(#node)" filter="url(#shadow)"/>
  <circle cx="120" cy="280" r="22" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="120" y="287" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#4f46e5" text-anchor="middle">筑基</text>

  <!-- 箭头 -->
  <line x1="148" y1="280" x2="188" y2="280" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="185,273 200,280 185,287" fill="#fff"/>

  <!-- ==== 状态节点 2：研发设计 (D) ==== -->
  <circle cx="220" cy="280" r="34" fill="url(#accent)" filter="url(#shadow)"/>
  <text x="220" y="288" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">设计</text>

  <!-- 箭头 -->
  <line x1="254" y1="280" x2="294" y2="280" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="291,273 306,280 291,287" fill="#fff"/>

  <!-- ==== 状态节点 3：原型确认 (P) ==== -->
  <circle cx="336" cy="280" r="28" fill="url(#node)" filter="url(#shadow)"/>
  <circle cx="336" cy="280" r="22" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="336" y="287" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#4f46e5" text-anchor="middle">原型</text>

  <!-- 箭头 -->
  <line x1="364" y1="280" x2="404" y2="280" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="401,273 416,280 401,287" fill="#fff"/>

  <!-- ==== 状态节点 4：归档 (E) ==== -->
  <circle cx="432" cy="280" r="28" fill="url(#node)" filter="url(#shadow)"/>
  <circle cx="432" cy="280" r="22" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="432" y="287" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#4f46e5" text-anchor="middle">归档</text>

  <!-- ==== 底部品牌文字 ==== -->
  <text x="256" y="370" font-family="'SF Mono', 'Courier New', monospace" font-size="28" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="6">NIMA</text>
  <text x="256" y="400" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.6)" text-anchor="middle" letter-spacing="4">泥马开发 v4.0</text>

  <!-- ==== 模式标记 ==== -->
  <rect x="60" y="84" width="90" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="105" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="rgba(255,255,255,0.85)" text-anchor="middle" letter-spacing="1">泥马开发</text>

  <!-- ==== 迭代标记 ==== -->
  <rect x="362" y="84" width="90" height="26" rx="13" fill="rgba(251,191,36,0.2)" stroke="rgba(251,191,36,0.3)" stroke-width="1"/>
  <text x="407" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="rgba(251,191,36,0.9)" text-anchor="middle" letter-spacing="1">需求内迭代</text>

</svg>
